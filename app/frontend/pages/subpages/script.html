{% for msg in data['script'] %}
<li class="{% if msg['role'] == 'BOT' %}in{% else %}out{% endif %}">
    <div class="chat-img">
        <img alt="Avtar" src="{% if msg['role'] == 'BOT' %}/static/img/logo-medium.png{% else %}/static/img/avatar6.png{% endif %}">
    </div>
    <div class="chat-body">
        <div class="chat-message">
            <h5>{% if msg['role'] == 'BOT' %}Robot{% else %}Customer{% endif %}</h5>
            <p>{{ msg['dialog'] }}</p>
        </div>
    </div>
</li>
{% endfor %}
