{% extends 'layout.html' %}
{% block title %}Call Logs{% endblock %}
{% block content %}

<style>
    .chat-list {
        padding: 0;
        font-size: .8rem;
    }

    .chat-list li {
        margin-bottom: 10px;
        overflow: auto;
        color: #ffffff;
    }

    .chat-list .chat-img {
        float: left;
        width: 48px;
    }

    .chat-list .chat-img img {
        -webkit-border-radius: 50px;
        -moz-border-radius: 50px;
        border-radius: 50px;
        width: 100%;
    }

    .chat-list .chat-message {
        -webkit-border-radius: 50px;
        -moz-border-radius: 50px;
        border-radius: 50px;
        background: #5a99ee;
        display: inline-block;
        padding: 10px 20px;
        position: relative;
    }

    .chat-list .chat-message:before {
        content: "";
        position: absolute;
        top: 15px;
        width: 0;
        height: 0;
    }

    .chat-list .chat-message h5 {
        margin: 0 0 5px 0;
        font-weight: 600;
        line-height: 100%;
        font-size: .9rem;
    }

    .chat-list .chat-message p {
        line-height: 18px;
        margin: 0;
        padding: 0;
    }

    .chat-list .chat-body {
        margin-left: 20px;
        float: left;
        width: 70%;
    }

    .chat-list .in .chat-message:before {
        left: -12px;
        border-bottom: 20px solid transparent;
        border-right: 20px solid #5a99ee;
    }

    .chat-list .out .chat-img {
        float: right;
    }

    .chat-list .out .chat-body {
        float: right;
        margin-right: 20px;
        text-align: right;
    }

    .chat-list .out .chat-message {
        background: #fc6d4c;
    }

    .chat-list .out .chat-message:before {
        right: -12px;
        border-bottom: 20px solid transparent;
        border-left: 20px solid #fc6d4c;
    }

    .card .card-header:first-child {
        -webkit-border-radius: 0.3rem 0.3rem 0 0;
        -moz-border-radius: 0.3rem 0.3rem 0 0;
        border-radius: 0.3rem 0.3rem 0 0;
    }

    .card .card-header {
        background: #17202b;
        border: 0;
        font-size: 1rem;
        padding: .65rem 1rem;
        position: relative;
        font-weight: 600;
        color: #ffffff;
    }

    .modal-dialog {
        overflow-y: initial !important
    }

    .modal-body {
        height: 80vh;
        overflow-y: auto;
    }
</style>

<table id="messagelogs" class="table">
    <thead>
        <tr>
            <th>Customer Name</th>
            <th>Customer Phone</th>
            <th>Last Activity</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for log in data['logs'] %}
        <tr>
            <td>{{ log['senderName'] }}</td>
            <td>{{ log['number'] }}</td>
            <td>{{ log['time'] }}</td>
            <td>
                <a href="#" onclick="clearScript('{{ log.number }}')"><i style="font-size: 16pt;" title="Remove" class="fas fa-trash text-danger p-1"></i></a>
                <a href="#" onclick="loadScript('{{ log.number }}')" data-toggle="modal" data-target="#script"><i style="font-size: 16pt;" title="View Script" class="fas fa-users text-primary p-1"></i></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="modal" id="script">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h4 class="modal-title">Customer Conversation</h4>
                <button type="button" class="btn btn-danger" data-dismiss="modal"><i title="Close Chat"
                        class="fas fa-times"></i></button>
            </div>

            <div class="modal-body">
                <ul class="chat-list"></ul>
            </div>
            <div class="modal-footer">
                <button id="export-btn" type="button" class="btn btn-secondary"><i title="Download Call Script"
                        class="fas fa-download"></i> Download Script</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/jquery.js"></script>
<script src="/static/js/jquery.dataTables.min.js"></script>
<script src="/static/js/dataTables.buttons.min.js"></script>
<script src="/static/js/jszip.min.js"></script>
<script src="/static/js/pdfmake.min.js"></script>
<script src="/static/js/vfs_fonts.js"></script>
<script src="/static/js/buttons.html5.min.js"></script>
<script src="/static/js/buttons.print.min.js"></script>


<script>
    $(document).ready(function () {
        new DataTable('#messagelogs', {
            order: [],
            paging: true,
            lengthChange: true,
            searching: true,
            ordering: true,
            info: true,
            autoWidth: false,
            responsive: true,
            dom: 'Bfrtip',
            buttons: [
                {
                    extend: 'csvHtml5',
                    exportOptions: {
                        columns: ':not(:last-child)'
                    }
                },
                {
                    extend: 'excelHtml5',
                    exportOptions: {
                        columns: ':not(:last-child)'
                    }
                },
                {
                    extend: 'pdfHtml5',
                    exportOptions: {
                        columns: ':not(:last-child)'
                    }
                },
                {
                    extend: 'print',
                    exportOptions: {
                        columns: ':not(:last-child)'
                    }
                }
            ]
        });

        $('#export-btn').click(function () {
            let chatText = '';
            $('.chat-list li').each(function () {
                const role = $(this).find('h5').text();
                const dialog = $(this).find('p').text();
                chatText += role + ': ' + dialog + '\n';
            });
            const blob = new Blob([chatText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'call-script.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    });

    function loadScript(id) {
        $.ajax({
            url: "/admin/messages/" + id,
            type: "GET",
            xhrFields: {
                withCredentials: true
            },
            success: function (response) {
                $('.chat-list').html(response);
            },
            error: function (xhr, status, error) {
                alert(error);
            }
        });
    }
</script>

{% endblock %}
