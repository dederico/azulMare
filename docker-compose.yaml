version: "3.4"
services:
  robot:
    build: ./
    container_name: Beholder-Robot
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
        "--reload",
      ]
    ports:
      - 8010:8010
    env_file:
      - .env
    volumes:
      - ./app:/app
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"
